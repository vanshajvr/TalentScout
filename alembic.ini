# Schema migrations. The database URL comes from DATABASE_URL (see alembic/env.py),
# never from this file.
#
#   alembic upgrade head          apply pending migrations (the container does this on start)
#   alembic revision -m "..."     new migration; --autogenerate diffs db/models.py vs. the DB
#   alembic current / history     where a database is / what exists

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
