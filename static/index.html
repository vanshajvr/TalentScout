<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TalentScout — Hiring Assistant</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="logo">TS</div>
    <div class="header-text">
      <div class="title">TalentScout — Hiring Assistant</div>
      <div class="status" id="status-line">Starting screening…</div>
    </div>
  </header>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill-static" id="progress-fill" style="width:0%"></div></div>
    <div class="progress-label" id="progress-label">Getting started</div>
  </div>
  <div id="chat"></div>
  <div id="paste-note" class="paste-note" style="display:none;">This answer was pasted, not typed.</div>
  <footer>
    <input type="file" id="resume-input" accept=".pdf,.docx" style="display:none;">
    <button type="button" id="upload-trigger" class="upload-btn" style="display:none;">Upload Resume</button>
    <textarea id="input" rows="1" placeholder="Type your answer…" disabled></textarea>
    <button id="send" disabled>Send</button>
  </footer>
</div>
<script src="/static/app.js"></script>
</body>
</html>
