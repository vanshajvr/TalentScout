<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TalentScout — Hiring Assistant</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161920;
    --bubble-bot: #1f2430;
    --bubble-user: #2b5cff;
    --text: #e8e9ec;
    --muted: #8b8f9a;
    --accent: #2b5cff;
    --warn: #d97706;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center; padding: 24px;
  }
  .app {
    width: 100%; max-width: 640px; display: flex; flex-direction: column;
    height: 90vh; background: var(--panel); border-radius: 16px; overflow: hidden;
    border: 1px solid #262a35;
  }
  header {
    padding: 16px 20px; border-bottom: 1px solid #262a35;
    font-weight: 600; font-size: 15px;
  }
  header span { color: var(--muted); font-weight: 400; font-size: 13px; display:block; margin-top:2px;}
  #chat {
    flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;
  }
  .bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; font-size: 14.5px;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .bot { align-self: flex-start; background: var(--bubble-bot); border-bottom-left-radius: 4px; }
  .user { align-self: flex-end; background: var(--bubble-user); border-bottom-right-radius: 4px; }
  .pasted-tag {
    font-size: 11px; color: var(--warn); margin-top: 4px; display: block;
  }
  .typing {
    align-self: flex-start; display: flex; gap: 4px; padding: 10px 14px;
    background: var(--bubble-bot); border-radius: 14px; border-bottom-left-radius: 4px;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%,60%,100%{ transform: translateY(0); opacity:.5;} 30%{ transform: translateY(-4px); opacity:1;} }

  .gen-panel {
    align-self: flex-start; max-width: 78%; padding: 14px 16px;
    background: var(--bubble-bot); border-radius: 14px; border-bottom-left-radius: 4px;
  }
  .gen-panel .label { font-size: 13.5px; margin-bottom: 8px; }
  .progress-track { width: 100%; height: 4px; background: #2a2f3c; border-radius: 4px; overflow: hidden; }
  .progress-fill {
    height: 100%; width: 30%; background: var(--accent); border-radius: 4px;
    animation: slide 1.6s infinite ease-in-out;
  }
  @keyframes slide {
    0% { transform: translateX(-100%); width: 40%; }
    50% { width: 60%; }
    100% { transform: translateX(250%); width: 40%; }
  }

  footer { padding: 14px; border-top: 1px solid #262a35; display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; background: #1c202a; color: var(--text); border: 1px solid #2a2f3c;
    border-radius: 10px; padding: 10px 12px; font-size: 14px; font-family: inherit; max-height: 120px;
    transition: border-color .15s;
  }
  textarea.pasted-flag { border-color: var(--warn); }
  button {
    background: var(--accent); color: white; border: none; border-radius: 10px;
    padding: 10px 18px; font-size: 14px; cursor: pointer; font-weight: 500;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .paste-note { font-size: 11px; color: var(--warn); padding: 0 14px 8px; }
</style>
</head>
<body>
<div class="app">
  <header>
    TalentScout — Hiring Assistant
    <span id="status-line">Starting screening…</span>
  </header>
  <div id="chat"></div>
  <div id="paste-note" class="paste-note" style="display:none;">This answer was pasted, not typed.</div>
  <footer>
    <textarea id="input" rows="1" placeholder="Type your answer…" disabled></textarea>
    <button id="send" disabled>Send</button>
  </footer>
</div>

<script>
const API = "";
let sessionId = null;
let lastKnownStep = null;
let pastedThisTurn = false;

const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const statusLine = document.getElementById("status-line");
const pasteNote = document.getElementById("paste-note");

function addBubble(role, text, wasPasted = false) {
  const div = document.createElement("div");
  div.className = "bubble " + (role === "user" ? "user" : "bot");
  div.textContent = text;
  if (wasPasted) {
    const tag = document.createElement("span");
    tag.className = "pasted-tag";
    tag.textContent = "pasted";
    div.appendChild(tag);
  }
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function showTyping() {
  const div = document.createElement("div");
  div.className = "typing";
  div.id = "typing-indicator";
  div.innerHTML = "<span></span><span></span><span></span>";
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function showGeneratingPanel() {
  const div = document.createElement("div");
  div.className = "gen-panel";
  div.id = "typing-indicator";
  div.innerHTML = `
    <div class="label">Be ready for some questions based on your profile…</div>
    <div class="progress-track"><div class="progress-fill"></div></div>
  `;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById("typing-indicator");
  if (el) el.remove();
}

function setInputEnabled(enabled) {
  inputEl.disabled = !enabled;
  sendBtn.disabled = !enabled;
  if (enabled) inputEl.focus();
}

async function startSession() {
  const res = await fetch(`${API}/sessions`, { method: "POST" });
  const data = await res.json();
  sessionId = data.session_id;
  addBubble("assistant", data.message);
  lastKnownStep = "greeting";
  statusLine.textContent = "Screening in progress";
  setInputEnabled(true);
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;

  addBubble("user", text, pastedThisTurn);
  inputEl.value = "";
  inputEl.classList.remove("pasted-flag");
  pasteNote.style.display = "none";
  setInputEnabled(false);

  // the slow LLM call happens right after confirming tech stack, or on any
  // turn already inside the interview loop — show the richer loading state then
  const expectingGeneration =
    lastKnownStep === "confirm_tech_stack" || lastKnownStep === "interviewing";

  if (expectingGeneration) showGeneratingPanel();
  else showTyping();

  const wasPasted = pastedThisTurn;
  pastedThisTurn = false;

  try {
    const res = await fetch(`${API}/sessions/${sessionId}/messages`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, pasted: wasPasted }),
    });
    const data = await res.json();
    removeTyping();

    data.messages.forEach((m) => addBubble("assistant", m));
    lastKnownStep = data.step;

    if (data.step === "end") {
      statusLine.textContent = "Screening complete";
      setInputEnabled(false);
      return;
    }
  } catch (err) {
    removeTyping();
    addBubble("assistant", "Something went wrong — please try again.");
  }

  setInputEnabled(true);
}

inputEl.addEventListener("paste", () => {
  pastedThisTurn = true;
  inputEl.classList.add("pasted-flag");
  pasteNote.style.display = "block";
});

inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = inputEl.scrollHeight + "px";
});

inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

sendBtn.addEventListener("click", sendMessage);

startSession();
</script>
</body>
</html>
