<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TalentScout — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="tier-select">
  <div class="tier-panel">
    <div class="landing-nav-brand" style="margin-bottom:24px;">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fdf3ee" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="10" r="6.5"></circle><line x1="15.2" y1="15.2" x2="20" y2="20"></line></svg>
      </div>
      <span class="landing-nav-name">TalentScout</span>
    </div>
    <div class="tier-panel-title">One platform,<br>three ways in.</div>
    <div class="tier-panel-sub">Pick the role that matches what you're here to do.</div>
    <button id="back-to-landing-login" class="tier-back-link">← Back to home</button>
  </div>

  <div class="tier-options">
    <button class="tier-card tier-card-featured" data-target="/">
      <div class="tier-card-icon"><i class="ti ti-user"></i></div>
      <div class="tier-card-body">
        <div class="tier-card-heading">
          <span>Candidate</span>
          <span class="tier-badge">Start here</span>
        </div>
        <div class="tier-card-copy">A few details, then straight into your screening.</div>
      </div>
      <i class="ti ti-chevron-right tier-card-arrow"></i>
    </button>

    <button class="tier-card" data-target="/recruiter">
      <div class="tier-card-icon"><i class="ti ti-users"></i></div>
      <div class="tier-card-body">
        <div class="tier-card-heading"><span>Recruiter</span></div>
        <div class="tier-card-copy">Review candidates and transcripts for your team.</div>
      </div>
      <i class="ti ti-chevron-right tier-card-arrow"></i>
    </button>

    <button class="tier-card" data-target="/recruiter?admin=true">
      <div class="tier-card-icon"><i class="ti ti-briefcase"></i></div>
      <div class="tier-card-body">
        <div class="tier-card-heading"><span>HR supervisor</span></div>
        <div class="tier-card-copy">Create your org, manage recruiters, generate invites.</div>
      </div>
      <i class="ti ti-chevron-right tier-card-arrow"></i>
    </button>
  </div>
</div>

<script src="/static/login.js"></script>
</body>
</html>
