<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TalentScout — Recruiter Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div id="login-view" class="login-box">
  <div style="display:flex; align-items:center; gap:10px; margin-bottom:20px;">
    <div class="logo-icon" style="width:36px; height:36px; border-radius:10px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fdf3ee" stroke-width="2" stroke-linecap="round" style="width:17px;height:17px;"><circle cx="10" cy="10" r="6.5"></circle><line x1="15.2" y1="15.2" x2="20" y2="20"></line></svg>
    </div>
    <div style="font-size:19px; font-weight:700; color:var(--text);">TalentScout</div>
  </div>
  <div style="font-size:13px; color:var(--muted); margin-bottom:18px;">Recruiter login</div>
  <input type="password" id="password-input" placeholder="Password">
  <button class="landing-btn landing-btn-primary" id="login-btn" style="width:100%; text-align:center;">Log in</button>
  <div id="login-error" class="error-text" style="display:none;"></div>
</div>

<div id="dash-view" class="rec-shell" style="display:none;">
  <div class="sidebar">
    <div class="sidebar-brand">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fdf3ee" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="10" r="6.5"></circle><line x1="15.2" y1="15.2" x2="20" y2="20"></line></svg>
      </div>
      <div class="sidebar-brand-name">TalentScout</div>
    </div>
    <div class="rec-nav">
      <button class="rec-nav-item active" data-tab="overview">Overview</button>
      <button class="rec-nav-item" data-tab="candidates">Candidates</button>
      <button class="rec-nav-item" data-tab="responses">Interview Responses</button>
    </div>
  </div>

  <div class="rec-main">
    <div class="main-header">
      <div class="main-title">Recruiter Dashboard</div>
      <div class="main-sub" id="candidate-count">Loading…</div>
    </div>

    <div id="tab-overview" class="tab-panel">
      <div class="stat-grid" id="stat-grid"></div>
    </div>

    <div id="tab-candidates" class="tab-panel hidden">
      <div class="filters">
        <input type="text" id="filter-role" placeholder="Role contains…">
        <input type="text" id="filter-tech" placeholder="Tech stack contains…">
        <input type="number" id="filter-experience" placeholder="Min experience (yrs)" step="0.5">
        <select id="filter-status">
          <option value="">Any status</option>
          <option value="in_progress">In progress</option>
          <option value="completed">Completed</option>
        </select>
        <button id="apply-filters">Apply</button>
        <button id="export-btn">Export CSV</button>
        <button id="delete-btn" style="background:var(--warn);">Delete Selected</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:30px;"><input type="checkbox" id="select-all"></th>
              <th>Name</th><th>Email</th><th>Phone</th><th>Location</th>
              <th>Experience</th><th>Role</th><th>Tech Stack</th>
              <th>Resume</th><th>Status</th><th>Applied</th>
            </tr>
          </thead>
          <tbody id="candidates-body"></tbody>
        </table>
      </div>
    </div>

    <div id="tab-responses" class="tab-panel hidden">
      <div class="responses-picker">
        <select id="responses-candidate-select">
          <option value="">Select a candidate…</option>
        </select>
      </div>
      <div class="qa-list" id="responses-list"></div>
    </div>
  </div>
</div>

<script src="/static/recruiter.js"></script>
</body>
</html>
