<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TalentScout — Recruiter Dashboard</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body { align-items: flex-start; }
  .dash { width: 100%; max-width: 1100px; height: auto; max-height: none; }
  .login-box { max-width: 360px; margin: 80px auto; padding: 28px; background: var(--panel); border-radius: 14px; border: 1px solid var(--border); }
  .login-box input { width: 100%; padding: 10px 12px; margin: 10px 0; background: #171b26; color: var(--text); border: 1px solid var(--border); border-radius: 8px; }
  .login-box button { width: 100%; }
  .error-text { color: var(--warn); font-size: 13px; margin-top: 6px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .filters input, .filters select { padding: 8px 10px; background: #171b26; color: var(--text); border: 1px solid var(--border); border-radius: 8px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--panel); }
  .table-wrap { overflow-x: auto; max-height: 65vh; overflow-y: auto; }
  .badge { padding: 2px 8px; border-radius: 6px; font-size: 11px; }
  .badge.completed { background: #16532933; color: #4ade80; }
  .badge.in_progress { background: #78350f33; color: #fbbf24; }
</style>
</head>
<body>

<div id="login-view" class="login-box">
  <h2 style="margin-top:0;">Recruiter Login</h2>
  <input type="password" id="password-input" placeholder="Password">
  <button id="login-btn" style="width:100%;">Log In</button>
  <div id="login-error" class="error-text" style="display:none;"></div>
</div>

<div id="dash-view" class="app dash" style="display:none;">
  <header>
    <div class="logo">TS</div>
    <div class="header-text">
      <div class="title">Recruiter Dashboard</div>
      <div class="status" id="candidate-count">Loading…</div>
    </div>
    <button id="export-btn">Export CSV</button>
  </header>
  <div class="filters">
    <input type="text" id="filter-role" placeholder="Role contains…">
    <input type="text" id="filter-tech" placeholder="Tech stack contains…">
    <input type="number" id="filter-experience" placeholder="Min experience (yrs)" step="0.5">
    <select id="filter-status">
      <option value="">Any status</option>
      <option value="in_progress">In progress</option>
      <option value="completed">Completed</option></option>
    </select>
    <button id="apply-filters">Apply</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Name</th><th>Email</th><th>Phone</th><th>Location</th>
          <th>Experience</th><th>Role</th><th>Tech Stack</th>
          <th>Resume</th><th>Status</th><th>Applied</th>
        </tr>
      </thead>
      <tbody id="candidates-body"></tbody>
    </table>
  </div>
</div>

<script src="/static/recruiter.js"></script>
</body>
</html>
